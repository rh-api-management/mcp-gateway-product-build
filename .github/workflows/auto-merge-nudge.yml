name: Auto-merge Konflux nudge PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [nightly]

permissions:
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'red-hat-konflux[bot]' && startsWith(github.head_ref, 'konflux/component-updates/')
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        run: gh pr review ${{ github.event.pull_request.number }} --approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
