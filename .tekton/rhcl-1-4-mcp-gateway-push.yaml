apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/rh-api-management/mcp-gateway-product-build?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch
      == "rhcl-1.4" && ( "mcp-gateway/*".pathChanged() || "mcp-gateway".pathChanged() || "Containerfile.mcp-gateway".pathChanged()
      || ".tekton/multi-arch-build-pipeline.yaml".pathChanged() || ".tekton/rhcl-1-4-mcp-gateway-push.yaml".pathChanged()
      )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: rhcl-1-4-mcp-gateway
    appstudio.openshift.io/component: rhcl-1-4-mcp-gateway
    pipelines.appstudio.openshift.io/type: build
  name: rhcl-1-4-mcp-gateway-on-push
  namespace: api-management-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/api-management-tenant/rhcl-1-4-mcp-gateway:{{revision}}
  - name: dockerfile
    value: Containerfile.mcp-gateway
  - name: prefetch-input
    value: '[{"type": "gomod", "path": "mcp-gateway/"}]'
  pipelineRef:
    name: build-pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhcl-1-4-mcp-gateway
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
